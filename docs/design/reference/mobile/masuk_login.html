  </head><body class="bg-surface font-body-md text-on-surface relative min-h-screen"><div class="fixed inset-0 pointer-events-none -z-10 overflow-hidden"><div class="absolute -top-[100px] right-0 w-[320px] h-[320px] rounded-full bg-secondary-fixed blur-[90px] opacity-50"></div><div class="absolute top-[350px] -left-[100px] w-[300px] h-[300px] rounded-full bg-primary-fixed blur-[80px] opacity-60"></div></div><header class="fixed top-0 inset-x-0 z-50 bg-surface/75 backdrop-blur-xl shadow-[0_1px_8px_rgba(0,0,0,0.04)] pt-safe"><div class="h-16 px-gutter flex items-center justify-between"><div class="flex items-center gap-space-sm"><button aria-label="Kembali" class="w-11 h-11 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-container-high/40 transition-colors" onclick="history.back()"><span class="material-symbols-outlined text-[24px]">arrow_back</span></button><h1 class="font-headline-sm text-headline-sm text-on-surface tracking-tight leading-none">Pengaturan</h1></div><div class="flex items-center"><div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center shadow-[0_2px_8px_rgba(97,61,222,0.35)]"><span class="material-symbols-outlined text-on-primary text-[18px]">person</span></div></div></div></header><main class="flex flex-col relative w-full pt-16 pb-safe bg-transparent px-margin min-h-screen"><div class="flex flex-col w-full py-space-sm">
<div class="relative w-full rounded-lg bg-surface-container-lowest/80 backdrop-blur-2xl shadow-xl p-space-lg flex flex-col gap-space-lg overflow-hidden">
<div class="absolute -top-12 -right-12 w-44 h-44 rounded-full bg-secondary-fixed/40 blur-2xl pointer-events-none"></div>
<div class="absolute -bottom-16 -left-12 w-48 h-48 rounded-full bg-primary-fixed/50 blur-2xl pointer-events-none"></div>

<div class="w-16 h-16 rounded-full bg-gradient-to-tr from-primary to-secondary-container flex items-center justify-center shadow-lg shadow-primary/20 mb-space-xs">
<div class="w-13 h-13 rounded-full bg-surface-container-lowest/70 backdrop-blur-md flex items-center justify-center p-space-xs">
<span class="material-symbols-outlined text-primary text-[30px]" style="font-variation-settings: 'FILL' 1;">bolt</span>
</div>
</div>
<div class="inline-flex items-center gap-space-xs px-space-md py-0.5 rounded-full bg-surface-container-high/60">
<span class="w-2 h-2 rounded-full bg-secondary"></span>
<span class="font-label-md text-label-md tracking-widest text-on-surface uppercase">HYBRID 20</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant font-medium">Pelacak Kebugaran Personal 20 Minggu</p>
<p class="font-body-md text-body-md text-on-surface font-normal mt-space-xs">Masuk ke jurnal kebugaran pribadimu.</p>
</div>
<form class="relative flex flex-col gap-space-md" onsubmit="event.preventDefault();">
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface font-semibold flex items-center gap-space-xs" for="input-email">
<span class="material-symbols-outlined text-primary text-[18px]">alternate_email</span>
          Email
        </label>
<div class="relative w-full">
<input class="w-full h-13 px-space-md rounded-[1rem] bg-surface-container-lowest/90 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none shadow-sm transition-all focus:bg-surface-container-lowest" id="input-email" placeholder="nama@email.com" type="email" value="atlet@hybrid20.id"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-lg text-label-lg text-on-surface font-semibold flex items-center gap-space-xs" for="input-password">
<span class="material-symbols-outlined text-primary text-[18px]">lock</span>
          Kata Sandi
        </label>
<div class="relative w-full flex items-center">
<input class="w-full h-13 pl-space-md pr-12 rounded-[1rem] bg-surface-container-lowest/90 font-body-md text-body-md text-on-surface placeholder:text-outline focus:outline-none shadow-sm transition-all focus:bg-surface-container-lowest" id="input-password" placeholder="Masukkan kata sandi" type="password" value="p@sswordAthl3t3!"/>
<button aria-label="Tampilkan atau sembunyikan kata sandi" class="absolute right-2 w-10 h-10 flex items-center justify-center text-outline hover:text-on-surface rounded-full transition-colors" id="toggle-password" type="button">
<span class="material-symbols-outlined text-[20px]" id="eye-icon">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between pt-space-xs">
<label class="flex items-center gap-space-xs cursor-pointer select-none">
<input checked="" class="sr-only peer" id="remember-session" type="checkbox"/>
<div class="w-5 h-5 rounded-full bg-surface-container-high peer-checked:bg-primary flex items-center justify-center transition-all shadow-sm">
<span class="material-symbols-outlined text-on-primary text-[14px] opacity-0 peer-checked:opacity-100 transition-opacity">check</span>
</div>
<span class="font-body-sm text-body-sm text-on-surface-variant font-medium">Ingat sesi di perangkat ini</span>
</label>
</div>
<div class="pt-space-xs flex flex-col gap-space-sm">
<button class="w-full h-14 rounded-full bg-gradient-to-r from-primary to-primary-container text-on-primary font-headline-sm text-headline-sm flex items-center justify-center gap-space-xs shadow-lg shadow-primary/30 active:scale-[0.98] transition-transform" id="btn-login" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-[22px]">arrow_forward</span>
</button>
<div class="text-center py-space-xs">
<button class="font-label-md text-label-md text-primary font-semibold hover:text-primary-container transition-colors inline-flex items-center gap-1" type="button">
            Lupa kata sandi?
          </button>
</div>
</div>
</form>
<div class="relative rounded-[1rem] bg-surface-container-low/70 p-space-sm flex items-center gap-space-sm">
<div class="w-8 h-8 rounded-full bg-secondary-container/50 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-secondary-container text-[18px]">verified_user</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant leading-snug">
        Data tersimpan terenkripsi secara lokal di perangkatmu.
      </p>
</div>
</div>
<div class="mt-space-md flex items-center justify-center gap-space-xs text-center text-outline">
<span class="material-symbols-outlined text-[16px]">lock_clock</span>
<span class="font-body-sm text-body-sm">Akses Privat Atlet Tunggal • Versi 2.4.0</span>
</div>
<script>
    (function() {
      const toggleBtn = document.getElementById('toggle-password');
      const passInput = document.getElementById('input-password');
      const eyeIcon = document.getElementById('eye-icon');

      if (toggleBtn && passInput && eyeIcon) {
        toggleBtn.addEventListener('click', function() {
          const isPassword = passInput.getAttribute('type') === 'password';
          passInput.setAttribute('type', isPassword ? 'text' : 'password');
          eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
        });
      }

      const loginBtn = document.getElementById('btn-login');
      if (loginBtn) {
        loginBtn.addEventListener('click', function() {
          loginBtn.classList.add('opacity-90');
          setTimeout(() => {
            loginBtn.classList.remove('opacity-90');
          }, 300);
        });
      }
    })();
  </script>
</div></main></body></html>
