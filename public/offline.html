<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#613dde">
    <title>Kamu Sedang Offline — HYBRID 20</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fdf8ff;
            color: #1a1b23;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.25rem;
            line-height: 1.5;
        }
        .offline-card {
            background: #ffffff;
            border: 1px solid rgba(121, 116, 137, 0.25);
            border-radius: 1.5rem;
            padding: 2rem 1.5rem;
            max-width: 26rem;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(97, 61, 222, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.04);
        }
        .icon-circle {
            width: 4.5rem;
            height: 4.5rem;
            background: rgba(97, 61, 222, 0.1);
            color: #613dde;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.25rem;
        }
        .icon-circle svg {
            width: 2.25rem;
            height: 2.25rem;
            fill: currentColor;
        }
        h1 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1a1b23;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 0.875rem;
            color: #49454f;
            margin-bottom: 1.75rem;
        }
        .btn-retry {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
            min-height: 48px;
            padding: 0.75rem 1.5rem;
            background-color: #613dde;
            color: #ffffff;
            font-size: 0.9375rem;
            font-weight: 600;
            border: none;
            border-radius: 9999px;
            cursor: pointer;
            transition: transform 0.15s ease-out, background-color 0.15s ease-out;
            box-shadow: 0 4px 12px rgba(97, 61, 222, 0.25);
        }
        .btn-retry:active {
            transform: scale(0.97);
        }
        .btn-retry:hover {
            background-color: #522ecc;
        }
    </style>
</head>
<body>
    <main class="offline-card" role="main">
        <div class="icon-circle" aria-hidden="true">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
            </svg>
        </div>
        <h1>Kamu Sedang Offline</h1>
        <p>Menyimpan atau melihat data kebugaran membutuhkan koneksi internet aktif. Data kamu aman di server.</p>
        <button type="button" class="btn-retry" onclick="window.location.reload()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <span>Coba Lagi</span>
        </button>
    </main>
</body>
</html>
